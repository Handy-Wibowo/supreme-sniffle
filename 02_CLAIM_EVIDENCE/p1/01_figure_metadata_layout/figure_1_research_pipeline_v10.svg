<svg width="860" height="820" viewBox="0 0 860 820" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h{font-family:Arial,sans-serif;font-size:17px;font-weight:700}
    .th{font-family:Arial,sans-serif;font-size:14px;font-weight:700}
    .ts{font-family:Arial,sans-serif;font-size:12px;font-weight:400}
    .teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal text{fill:#085041}
    .purple rect{fill:#EEEDFE;stroke:#534AB7}.purple text{fill:#3C3489}
    .amber rect{fill:#FFF2CC;stroke:#9A6700}.amber text{fill:#633806}
    .gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray text{fill:#444441}
    .arr{stroke:#5F5E5A;stroke-width:1.7;fill:none}
    .transfer{stroke:#9A6700;stroke-width:2.2;fill:none;stroke-dasharray:6 4}
  </style>
  <rect x="0" y="0" width="860" height="820" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9A6700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="h" x="430" y="28" text-anchor="middle" fill="#1a1a18">Rancangan evaluasi: dalam-korpus dan transfer lintas-korpus</text>

  <g class="teal">
    <rect x="35" y="50" width="360" height="455" rx="16" stroke-width="0.7"/>
    <text class="th" x="215" y="77" text-anchor="middle">Jalur A — PhiUSIIL</text>
    <text class="ts" x="215" y="97" text-anchor="middle">audit, protokol, dan ablasi kelompok</text>
    <rect x="65" y="120" width="300" height="48" rx="8" stroke-width="0.6"/>
    <text class="th" x="215" y="149" text-anchor="middle">Data mentah dan audit keterpulihan label</text>
    <rect x="65" y="200" width="300" height="64" rx="8" stroke-width="0.6"/>
    <text class="th" x="215" y="225" text-anchor="middle">Konfigurasi fitur A0, A1, dan A2</text>
    <text class="ts" x="215" y="246" text-anchor="middle">A1−A0 = ablasi kelompok; A2 = kontras representasi</text>
    <rect x="65" y="296" width="300" height="64" rx="8" stroke-width="0.6"/>
    <text class="th" x="215" y="321" text-anchor="middle">Evaluasi dalam-korpus</text>
    <text class="ts" x="215" y="342" text-anchor="middle">acak vs registrable-domain-disjoint; 5 seed</text>
    <rect x="65" y="392" width="300" height="78" rx="8" stroke-width="0.6"/>
    <text class="th" x="215" y="416" text-anchor="middle">Hasil PhiUSIIL</text>
    <text class="ts" x="215" y="437" text-anchor="middle">saturasi benchmark, bootstrap domain berpasangan,</text>
    <text class="ts" x="215" y="456" text-anchor="middle">dan batas makna praktis</text>
  </g>
  <path d="M215 168V190" class="arr" marker-end="url(#arrow)"/>
  <path d="M215 264V286" class="arr" marker-end="url(#arrow)"/>
  <path d="M215 360V382" class="arr" marker-end="url(#arrow)"/>

  <g class="purple">
    <rect x="465" y="50" width="360" height="455" rx="16" stroke-width="0.7"/>
    <text class="th" x="645" y="77" text-anchor="middle">Jalur B — PhreshPhish</text>
    <text class="ts" x="645" y="97" text-anchor="middle">evaluasi temporal dalam-korpus</text>
    <rect x="495" y="120" width="300" height="48" rx="8" stroke-width="0.6"/>
    <text class="th" x="645" y="149" text-anchor="middle">Data bertanggal dan verifikasi label</text>
    <rect x="495" y="200" width="300" height="64" rx="8" stroke-width="0.6"/>
    <text class="th" x="645" y="225" text-anchor="middle">Pemisahan temporal dan pembersihan</text>
    <text class="ts" x="645" y="246" text-anchor="middle">deduplikasi; URL terlihat-latih dikeluarkan</text>
    <rect x="495" y="296" width="300" height="64" rx="8" stroke-width="0.6"/>
    <text class="th" x="645" y="321" text-anchor="middle">Representasi A2 dan model temporal</text>
    <text class="ts" x="645" y="342" text-anchor="middle">18 fitur URL-only; ambang dasar 0,5</text>
    <rect x="495" y="392" width="300" height="78" rx="8" stroke-width="0.6"/>
    <text class="th" x="645" y="416" text-anchor="middle">Hasil temporal</text>
    <text class="ts" x="645" y="437" text-anchor="middle">bootstrap domain, proyeksi prevalensi,</text>
    <text class="ts" x="645" y="456" text-anchor="middle">ambang operasional, dan taksonomi galat</text>
  </g>
  <path d="M645 168V190" class="arr" marker-end="url(#arrow)"/>
  <path d="M645 264V286" class="arr" marker-end="url(#arrow)"/>
  <path d="M645 360V382" class="arr" marker-end="url(#arrow)"/>

  <g class="amber">
    <rect x="95" y="535" width="670" height="120" rx="14" stroke-width="0.8"/>
    <text class="th" x="430" y="561" text-anchor="middle">Eksperimen transfer lintas-korpus zero-shot</text>
    <rect x="125" y="578" width="190" height="52" rx="8" stroke-width="0.6"/>
    <text class="th" x="220" y="599" text-anchor="middle">Latih pada PhiUSIIL A2</text>
    <text class="ts" x="220" y="617" text-anchor="middle">tanpa data PhreshPhish</text>
    <rect x="335" y="578" width="190" height="52" rx="8" stroke-width="0.6"/>
    <text class="th" x="430" y="599" text-anchor="middle">Bekukan pipeline</text>
    <text class="ts" x="430" y="617" text-anchor="middle">fitur, model, dan ambang</text>
    <rect x="545" y="578" width="190" height="52" rx="8" stroke-width="0.6"/>
    <text class="th" x="640" y="599" text-anchor="middle">Uji pada PhreshPhish</text>
    <text class="ts" x="640" y="617" text-anchor="middle">tanpa retraining atau tuning</text>
  </g>
  <path d="M315 604H325" class="transfer" marker-end="url(#arrowAmber)"/>
  <path d="M525 604H535" class="transfer" marker-end="url(#arrowAmber)"/>
  <path d="M215 505V520H220V568" class="transfer" marker-end="url(#arrowAmber)"/>
  <path d="M640 630V668" class="transfer" marker-end="url(#arrowAmber)"/>

  <g class="gray">
    <rect x="95" y="680" width="670" height="102" rx="14" stroke-width="0.7"/>
    <text class="th" x="430" y="708" text-anchor="middle">Sintesis dengan batas interpretasi</text>
    <text class="ts" x="430" y="730" text-anchor="middle">Pisahkan hasil statis, temporal dalam-korpus, dan transfer zero-shot.</text>
    <text class="ts" x="430" y="751" text-anchor="middle">Tidak ada klaim SOTA, kausalitas drift, zero-day, atau kesiapan deployment.</text>
  </g>
</svg>
